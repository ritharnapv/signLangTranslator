version: '3.8'

services:
  # Node.js Express Server + React SPA Frontend & REST API
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signsense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - signsense-network

  # Python FastAPI Real-time Neural & WebSocket Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signsense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - signsense-network

networks:
  signsense-network:
    driver: bridge
